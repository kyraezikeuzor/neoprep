<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>Sign in to Tutormigo</title>
    <!--[if mso]> <style type="text/css">body, table, td {   font-family: Arial, Helvetica, sans-serif !important; }</style> <![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <!-- Preheader (hidden preview text) -->
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        mso-hide: all;
        font-size: 1px;
        line-height: 1px;
        color: #f4f4f4;
      "
    >
      Click the link below to sign in to Tutormigo.
    </div>

    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #f4f4f4; margin: 0; padding: 0"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <!-- Card -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="
              width: 100%;
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 16px;
              border: 1px solid #ececec;
            "
          >
            <tr>
              <td align="center" style="padding: 48px 40px 40px 40px">
                <!-- Logo -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td align="center" style="padding-bottom: 28px">
                      <img
                        src="{{ .SiteURL }}/neoprep-logo.png"
                        alt="Tutormigo"
                        width="64"
                        height="64"
                        style="
                          display: block;
                          width: 64px;
                          height: 64px;
                          border: 0;
                          border-radius: 14px;
                        "
                      />
                    </td>
                  </tr>
                </table>

                <!-- Heading -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td
                      align="center"
                      style="
                        padding-bottom: 12px;
                        font-family: Helvetica, Arial, sans-serif;
                        font-size: 28px;
                        line-height: 1.3;
                        font-weight: 700;
                        color: #0a0a0a;
                      "
                    >
                      Sign in to Tutormigo
                    </td>
                  </tr>
                </table>

                <!-- Body -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td
                      align="center"
                      style="
                        padding-bottom: 32px;
                        font-family: Helvetica, Arial, sans-serif;
                        font-size: 16px;
                        line-height: 1.5;
                        color: #747474;
                      "
                    >
                      Click the link below to sign in and keep practicing.
                    </td>
                  </tr>
                </table>

                <!-- Button -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      bgcolor="#09B5FF"
                      style="
                        background-color: #09b5ff;
                        border-radius: 10px;
                        mso-padding-alt: 14px 32px;
                      "
                    >
                      <!--[if mso]> <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ .ConfirmationURL }}" style="height: 48px; v-text-anchor: middle; width: 160px" arcsize="20%" stroke="f" fillcolor="#09B5FF"> <w:anchorlock /> <center style="                               color: #ffffff;                               font-family: Helvetica, Arial, sans-serif;                               font-size: 16px;                               font-weight: bold;                             ">Sign in</center> </v:roundrect> <![endif]-->
                      <!--[if !mso]><!-- -->
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        style="
                          display: inline-block;
                          background-color: #09b5ff;
                          color: #ffffff;
                          font-family: Helvetica, Arial, sans-serif;
                          font-size: 16px;
                          font-weight: 700;
                          line-height: 1.25;
                          text-align: center;
                          text-decoration: none;
                          padding: 14px 36px;
                          border-radius: 10px;
                          mso-hide: all;
                        "
                      >
                        Sign in
                      </a>
                      <!--<![endif]-->
                    </td>
                  </tr>
                </table>

                <!-- Divider -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="margin-top: 36px"
                >
                  <tr>
                    <td
                      style="
                        border-top: 1px solid #ececec;
                        font-size: 0;
                        line-height: 0;
                        height: 1px;
                      "
                    >
                      &nbsp;
                    </td>
                  </tr>
                </table>

                <!-- Footer -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td
                      align="center"
                      style="
                        padding-top: 24px;
                        font-family: Helvetica, Arial, sans-serif;
                        font-size: 12px;
                        line-height: 1.6;
                        color: #a3a3a3;
                      "
                    >
                      If you didn&rsquo;t request this email, there&rsquo;s nothing to worry about, you can safely
                      ignore it. This link is valid for 24 hours. Do not forward or share this email.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!-- /Card -->
        </td>
      </tr>
    </table>
  </body>
</html>
